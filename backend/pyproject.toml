[project]
name = "houseos"
version = "1.0.0"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.141,<0.142", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "pymysql>=1.1,<2", "pwdlib[argon2]>=0.2,<1",
  "cryptography>=44", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20", "openai>=2,<3", "anthropic>=0.60,<1",
  "pychromecast>=14,<15", "zeroconf>=0.151,<1", "pillow>=11", "pywebpush>=2,<3",
  "androidtvremote2>=0.3.2,<0.4", "requests>=2.32,<3", "urllib3>=2,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
extend-exclude = ["migrations"]  # applied history stays byte-identical
[tool.ruff.lint]
select = ["E9", "F"]

